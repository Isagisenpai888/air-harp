<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Air Guitar</title>
<style>
:root{--bg:#0b0a10;--fg:#f2f0f7;--dim:#a39fb5;--panel:rgba(14,12,22,.78)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0a10}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 "Avenir Next","Trebuchet MS",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#bar{position:fixed;left:14px;right:14px;bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
#bar>*{pointer-events:auto}
button{background:var(--panel);color:var(--fg);border:1px solid #fff3;border-radius:999px;padding:9px 16px;font:inherit;cursor:pointer;backdrop-filter:blur(6px)}
button:hover{border-color:#fff9}button:focus-visible{outline:2px solid #ffe36a;outline-offset:2px}
#go{background:#ffe36a;color:#15110a;border-color:#ffe36a;font-weight:700}
#msg{background:var(--panel);padding:9px 14px;border-radius:12px;color:var(--dim);max-width:60ch;backdrop-filter:blur(6px)}
select{background:var(--panel);color:var(--fg);border:1px solid #fff3;border-radius:999px;padding:9px 12px;font:inherit;max-width:220px}
h1{position:fixed;top:12px;left:16px;margin:0;font-size:22px;letter-spacing:.02em;text-shadow:0 2px 10px #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted hidden></video>
<h1>Air Guitar</h1>
<div id="bar">
  <button id="go">Start camera</button>
  <select id="dev" aria-label="Camera" hidden></select>
  <button id="mir">Mirror: on</button>
  <button id="undo">Undo string</button>
  <button id="clear">Clear</button>
  <div id="msg">Pinch with both hands and pull apart to make a new string; let go to place it. Pinch one end of a string with one hand to stretch it. Clap to clear everything. Sweep a finger through a string to pluck it. Mouse works too: drag to draw, hover to pluck.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),vid=document.getElementById('v'),msg=document.getElementById('msg');
let W,H,dpr;
function size(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);size();

/* ---------- audio: Karplus-Strong plucks ---------- */
let ac;
const DEG=[0,2,4,7,9];
function freqFor(len){
  const t=Math.min(1,Math.max(0,1-len/(Math.hypot(W,H)*.8)));
  const s=Math.round(t*14);
  return 110*Math.pow(2,(Math.floor(s/5)*12+DEG[s%5])/12);
}
function pluck(f,vol){
  if(!ac)return;
  const sr=ac.sampleRate,n=sr*1.8|0,p=Math.max(2,Math.round(sr/f)),buf=ac.createBuffer(1,n,sr),d=buf.getChannelData(0),r=new Float32Array(p);
  for(let i=0;i<p;i++)r[i]=Math.random()*2-1;
  for(let i=0,j=0;i<n;i++){const k=(j+1)%p;d[i]=r[j];r[j]=(r[j]+r[k])*.4985;j=k}
  const s=ac.createBufferSource(),gn=ac.createGain();
  s.buffer=buf;gn.gain.value=.55*vol;s.connect(gn).connect(ac.destination);s.start();
}

/* ---------- strings ---------- */
const strings=[],sparks=[],drag={},prev={};
const len=s=>Math.hypot(s.a[0]-s.b[0],s.a[1]-s.b[1]);
function X(p,q,r,s){
  const d=(q[0]-p[0])*(s[1]-r[1])-(q[1]-p[1])*(s[0]-r[0]);if(!d)return 0;
  const qx=r[0]-p[0],qy=r[1]-p[1];
  const t=(qx*(s[1]-r[1])-qy*(s[0]-r[0]))/d,u=(qx*(q[1]-p[1])-qy*(q[0]-p[0]))/d;
  return t>=0&&t<=1&&u>=0&&u<=1?[p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])]:0;
}
function distTo(s,x,y){
  const dx=s.b[0]-s.a[0],dy=s.b[1]-s.a[1],t=Math.max(0,Math.min(1,((x-s.a[0])*dx+(y-s.a[1])*dy)/(dx*dx+dy*dy||1)));
  return Math.hypot(x-(s.a[0]+t*dx),y-(s.a[1]+t*dy));
}
function hit(s,at,speed){
  const now=performance.now();
  if(now-s.t<90)return;
  s.t=now;s.amp=Math.min(1,.45+speed/40);s.ph=0;
  const f=freqFor(len(s));s.hue=(f-110)/700*300+170|0;
  pluck(f,.5+s.amp*.5);
  for(let i=0;i<22;i++){const a=Math.random()*6.283,v=1+Math.random()*4;sparks.push({x:at[0],y:at[1],vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,l:1,h:s.hue})}
}
function nearEnd(x,y){
  let best=null,bd=70;
  for(const s of strings)for(const k of ['a','b']){const d=Math.hypot(s[k][0]-x,s[k][1]-y);if(d<bd){bd=d;best={s,k}}}
  return best;
}
const commit=d=>{if(d&&d.a&&d.b&&Math.hypot(d.b[0]-d.a[0],d.b[1]-d.a[1])>40)strings.push({a:d.a,b:d.b,amp:0,ph:0,t:0,hue:200})};
/* clap to clear */
let armed=0,lastTwo=null,clapAt=0,flash=0;
function thump(){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.25);gn.gain.setValueAtTime(.6,t);gn.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(gn).connect(ac.destination);o.start();o.stop(t+.3)}
function clap(){
  const now=performance.now();if(now-clapAt<900)return;clapAt=now;armed=0;
  if(!strings.length)return;
  for(const s of strings)for(let i=0;i<10;i++){const u=Math.random();sparks.push({x:s.a[0]+(s.b[0]-s.a[0])*u,y:s.a[1]+(s.b[1]-s.a[1])*u,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,l:1,h:s.hue})}
  strings.length=0;for(const k in drag)delete drag[k];flash=1;thump();
}
/* one input (hand or mouse): x,y = tip, px,py = pinch point */
function input(id,x,y,pinching,px,py){
  const pv=prev[id];prev[id]=[x,y];
  if(pinching){
    if(!drag[id]){const g0=nearEnd(px,py);drag[id]=g0?{grab:g0}:id==='m'?{a:[px,py]}:{none:1}}
    const d=drag[id];
    if(d.grab){d.grab.s[d.grab.k]=[px,py];d.grab.s.amp=0}else if(d.a)d.b=[px,py];
  }else{
    const d=drag[id];
    if(d){commit(d);delete drag[id]}
    if(pv)for(const s of strings){const p=X(pv,[x,y],s.a,s.b);if(p)hit(s,p,Math.hypot(x-pv[0],y-pv[1]))}
  }
}
function release(id){delete prev[id];commit(drag[id]);delete drag[id]}

/* mouse / touch */
let down=false;
cv.addEventListener('pointerdown',e=>{
  if(ac&&ac.state==='suspended')ac.resume();
  const hs=strings.find(s=>distTo(s,e.clientX,e.clientY)<14);
  if(hs&&e.pointerType==='touch'){hit(hs,[e.clientX,e.clientY],20);return}
  down=true;cv.setPointerCapture(e.pointerId);input('m',e.clientX,e.clientY,true,e.clientX,e.clientY);
});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&!down)return;input('m',e.clientX,e.clientY,down,e.clientX,e.clientY)});
addEventListener('pointerup',()=>{if(down){down=false;input('m',0,0,false,0,0);delete prev.m}});

/* ---------- hands ---------- */
let hands=[],cam=false,mir=true,twoLock=false,sx,sy,sw,sh,hd,stream;
const BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function frame(){
  const vw=vid.videoWidth,vh=vid.videoHeight,k=Math.max(W/vw,H/vh);
  sw=vw*k;sh=vh*k;sx=(W-sw)/2;sy=(H-sh)/2;
}
const P=l=>[sx+(mir?1-l.x:l.x)*sw,sy+l.y*sh];
function onHands(r){
  frame();
  const L=r.multiHandLandmarks||[],seen={};
  hands=L.map(l=>l.map(P));
  const pin=hands.map(h=>Math.hypot(h[4][0]-h[8][0],h[4][1]-h[8][1])<Math.hypot(h[0][0]-h[9][0],h[0][1]-h[9][1])*.35);
  const mid=h=>[(h[4][0]+h[8][0])/2,(h[4][1]+h[8][1])/2];
  const grabbing=hands.some((h,i)=>drag['h'+i]&&drag['h'+i].grab)||hands.some((h,i)=>pin[i]&&nearEnd(mid(h)[0],mid(h)[1]));
  const both=hands.length===2&&pin[0]&&pin[1]&&(drag.two||!grabbing);
  const now=performance.now();
  if(hands.length===2){
    if(!pin[0]&&!pin[1]){
      const sz=(Math.hypot(hands[0][0][0]-hands[0][9][0],hands[0][0][1]-hands[0][9][1])+Math.hypot(hands[1][0][0]-hands[1][9][0],hands[1][0][1]-hands[1][9][1]))/2;
      const d=Math.hypot(hands[0][9][0]-hands[1][9][0],hands[0][9][1]-hands[1][9][1]);
      if(d>sz*1.8)armed=now;else if(d<sz*.9&&now-armed<700)clap();
      lastTwo={t:now,d,sz};
    }else lastTwo=null;
  }else if(lastTwo){
    if(now-lastTwo.t<200&&lastTwo.d<lastTwo.sz*1.8&&now-armed<900)clap();
    lastTwo=null;
  }
  if(both){
    delete drag.h0;delete drag.h1;delete prev.h0;delete prev.h1;
    drag.two={a:mid(hands[0]),b:mid(hands[1])};
  }else if(drag.two){release('two');twoLock=true}
  if(!pin.some(Boolean))twoLock=false;
  if(!both)hands.forEach((h,i)=>{
    const id='h'+i;seen[id]=1;
    if(twoLock&&pin[i]){delete drag[id];delete prev[id];return}
    input(id,h[8][0],h[8][1],pin[i],mid(h)[0],mid(h)[1]);
  });
  else seen.h0=seen.h1=1;
  ['h0','h1'].forEach(id=>{if(!seen[id])release(id)});
}
async function start(){
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  ac.resume();
  if(typeof Hands==='undefined'){msg.textContent='Hand tracking library did not load. Check your connection, or play with the mouse.';return}
  try{
    msg.textContent='Loading hand tracker…';
    await openCam(dev.value);
    if(!hd){
      hd=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+f});
      hd.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.5});
      hd.onResults(onHands);
      (async function loop(){await hd.send({image:vid});requestAnimationFrame(loop)})();
    }
    cam=true;document.getElementById('go').hidden=true;
    const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'),cur=stream.getVideoTracks()[0].getSettings().deviceId;
    dev.innerHTML=ds.map((d,i)=>`<option value="${d.deviceId}"${d.deviceId===cur?' selected':''}>${d.label||'Camera '+(i+1)}</option>`).join('');
    dev.hidden=ds.length<2;
    msg.textContent='Pinch with both hands to make a string, one hand to stretch it. Sweep a finger through to pluck. Clap to clear.';
  }catch(e){msg.textContent='Camera unavailable ('+e.message+'). Open this file over https or localhost and allow camera access, or play with the mouse.'}
}
async function openCam(id){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:id?{deviceId:{exact:id},width:1280,height:720}:{width:1280,height:720}});
  vid.srcObject=stream;await vid.play();
}
const dev=document.getElementById('dev');
dev.onchange=()=>openCam(dev.value).catch(e=>{msg.textContent='Could not open that camera: '+e.message});
document.getElementById('mir').onclick=e=>{mir=!mir;e.target.textContent='Mirror: '+(mir?'on':'off')};
document.getElementById('go').onclick=start;
document.getElementById('undo').onclick=()=>strings.pop();
document.getElementById('clear').onclick=()=>{strings.length=0};

/* ---------- render ---------- */
function drawString(s,now){
  const [ax,ay]=s.a,[bx,by]=s.b,L=len(s)||1,nx=-(by-ay)/L,ny=(bx-ax)/L;
  s.amp*=.985;s.ph+=.9;
  const live=s.amp>.02,N=40;
  g.lineWidth=live?2.5:1.6;
  g.strokeStyle=live?`hsl(${s.hue} 100% 72%)`:'rgba(255,255,255,.85)';
  g.shadowColor=live?`hsl(${s.hue} 100% 60%)`:'transparent';g.shadowBlur=live?18:0;
  g.beginPath();
  for(let i=0;i<=N;i++){
    const u=i/N,o=live?Math.sin(Math.PI*u)*Math.sin(s.ph+u*3)*s.amp*22:0;
    const x=ax+(bx-ax)*u+nx*o,y=ay+(by-ay)*u+ny*o;
    i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.stroke();g.shadowBlur=0;
  g.lineWidth=1;g.strokeStyle='rgba(255,255,255,.55)';g.beginPath();
  for(let i=1;i<12;i++){const u=1-Math.pow(2,-i/12),x=ax+(bx-ax)*u,y=ay+(by-ay)*u;g.moveTo(x-nx*5,y-ny*5);g.lineTo(x+nx*5,y+ny*5)}
  g.stroke();
  g.strokeStyle='#fff';g.fillStyle='#0b0a10';
  for(const p of [s.a,s.b]){g.beginPath();g.arc(p[0],p[1],5,0,6.283);g.fill();g.stroke()}
}
function render(now){
  g.fillStyle='#0b0a10';g.fillRect(0,0,W,H);
  if(cam&&vid.videoWidth){frame();g.save();g.translate(mir?sx+sw:sx,sy);g.scale(mir?-1:1,1);g.drawImage(vid,0,0,sw,sh);g.restore();g.fillStyle='rgba(8,6,14,.3)';g.fillRect(0,0,W,H)}
  for(const s of strings)drawString(s,now);
  if(flash>.02){g.fillStyle=`rgba(255,255,255,${flash*.3})`;g.fillRect(0,0,W,H);flash*=.88}
  for(const id in drag){const d=drag[id];if(d.b){drawString({a:d.a,b:d.b,amp:0,ph:0,hue:50},now)}}
  for(const h of hands){
    g.strokeStyle='#38e04a';g.lineWidth=2;g.beginPath();
    for(const [i,j] of BONES){g.moveTo(h[i][0],h[i][1]);g.lineTo(h[j][0],h[j][1])}
    g.stroke();g.fillStyle='#e8332d';
    for(const p of h){g.beginPath();g.arc(p[0],p[1],3,0,6.283);g.fill()}
    g.strokeStyle='#fff';g.beginPath();g.arc(h[8][0],h[8][1],7,0,6.283);g.stroke();
  }
  for(let i=sparks.length-1;i>=0;i--){
    const p=sparks[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l-=.025;
    if(p.l<=0){sparks.splice(i,1);continue}
    g.fillStyle=`hsl(${p.h} 100% 75% / ${p.l})`;g.fillRect(p.x,p.y,2.5,2.5);
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
