<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Harp</title>
  <style>
    body {
      margin: 0;
      background: #06080e;
      color: #eef2ff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
      min-height: 100vh;
      box-sizing: border-box;
    }
    body.record-only {
      padding: 0;
      gap: 0;
      justify-content: center;
      background: #000000;
      overflow: hidden;
    }
    body.record-only .header-row,
    body.record-only .controls,
    body.record-only .shortcuts {
      display: none !important;
    }
    .header-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h2 {
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #f8fafc;
    }
    .badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .stage {
      position: relative;
      width: 640px;
      max-width: 94vw;
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      overflow: hidden;
      background: #04060b;
      border: 1px solid #1e293b;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.16);
      transition: width 0.25s ease, aspect-ratio 0.25s ease;
    }
    .stage.reel-mode {
      width: 380px;
      max-height: 70vh;
      aspect-ratio: 9 / 16;
    }
    body.record-only .stage {
      width: 100vw;
      max-width: 100vw;
      height: 100vh;
      max-height: 100vh;
      aspect-ratio: auto;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
    body.record-only.reel-stage .stage {
      width: min(56.25vh, 100vw);
      height: 100vh;
      max-height: 100vh;
      aspect-ratio: 9 / 16;
    }
    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .stage.back-cam video,
    .stage.back-cam canvas {
      transform: none;
    }
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        circle at center,
        rgba(4, 6, 11, 0.0) 54%,
        rgba(4, 6, 11, 0.68) 100%
      );
    }
    .exit-record-btn {
      display: none;
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 30;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.72);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.35);
      font-size: 0.76rem;
      opacity: 0.35;
      transition: opacity 0.2s ease;
    }
    .exit-record-btn:hover {
      opacity: 1;
    }
    body.record-only .exit-record-btn {
      display: block;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 820px;
    }
    button {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: #38bdf8;
      color: #06101a;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
    }
    button:hover {
      background: #7dd3fc;
    }
    button.secondary {
      background: #131c2e;
      color: #e2e8f0;
      border: 1px solid #283548;
    }
    button.secondary:hover {
      background: #1e293b;
    }
    button.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    #status {
      width: 100%;
      text-align: center;
      font-size: 0.86rem;
      color: #94a3b8;
    }
    .shortcuts {
      font-size: 0.76rem;
      color: #64748b;
      text-align: center;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <button id="exitRecordBtn" class="exit-record-btn" title="Exit Record Mode (H / Esc)">Show UI</button>
  <div class="header-row">
    <h2>Air Harp</h2>
    <span class="badge">WebGL + WebAudio + MIDI</span>
  </div>
  <div id="stage" class="stage">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="glCanvas" width="1280" height="960"></canvas>
    <div class="vignette"></div>
  </div>
  <div class="controls">
    <button id="calibrateBtn">Calibrate Rest</button>
    <button id="recordBtn" class="secondary">Record View</button>
    <button id="camBtn" class="secondary">Cam: 1/1</button>
    <button id="pinBtn" class="secondary">Pin Middle: Off</button>
    <button id="scaleBtn" class="secondary">Scale: Ambasel</button>
    <button id="voiceBtn" class="secondary">Voice: Hybrid</button>
    <button id="strumBtn" class="secondary">Strum: Arp</button>
    <button id="reelBtn" class="secondary">Frame: 4:3</button>
    <button id="loverBoyBtn" class="secondary">Lover Boy: Off</button>
    <button id="quoteBtn" class="secondary">Quote: Off</button>
    <button id="midiBtn" class="secondary">MIDI: Off</button>
    <button id="musicBtn" class="secondary">Overtones: On</button>
    <button id="clearBtn" class="secondary">Clear</button>
    <span id="status">Starting camera...</span>
  </div>
  <div class="shortcuts">
    Keys: <b>C</b> Clear · <b>M</b> Pin Middle · <b>V</b> Voice · <b>S</b> Scale · <b>R</b> 9:16 Reel Frame · <b>L</b> Lover Boy · <b>Q</b> Quote Stab · <b>H</b> Record View
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
